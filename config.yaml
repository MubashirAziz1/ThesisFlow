# Logging

log_level: info

models:
  - name: glm-5-3-flash-260828
    display_name: GLM 5.3 Flash
    use: langchain_openai:ChatOpenAI
    model: glm-5-3-flash-260828
    api_key: $VOLCENGINE_API_KEY
    base_url: https://ark.ap-southeast.bytepluses.com/api/v3
    use_responses_api: true
    output_version: responses/v1
    request_timeout: 600.0
    max_retries: 2
    supports_thinking: true
    supports_vision: true

    when_thinking_enabled:
      extra_body:
        thinking:
          type: enabled

    when_thinking_disabled:
      extra_body:
        thinking:
          type: disabled

lead-agent:
  model_name: glm-5-3-flash-260828
  is_plan_mode: False
  thinking_enabled: false
  reasoning_effort: low 


stream_bridge:
  type: memory                 # single-process only
  queue_maxsize: 256           # data events retained per run. 

# Database
# ============================================================================
# Unified storage backend for the LangGraph checkpointer, LangGraph Store,
# and DeerFlow application data (runs, threads metadata, feedback, etc.).
#
# backend: memory  -- No persistence, data lost on restart

database:
  backend: memory
  sqlite_dir: .deer-flow/data
  pool_recycle: 300
  command_timeout: 30
  checkpoint_channel_mode: full
  checkpoint_delta:
    snapshot_frequency: 10